name: Preparar vista de prueba PR10 (sin tocar main)

on:
  push:
    branches: [feat/interfaz-editorial-primera-iteracion]
    paths-ignore:
      - 'preview/pr-10/**'

permissions:
  contents: write

concurrency:
  group: cuaderno-pr10-preview
  cancel-in-progress: true

jobs:
  compilar-vista-aislada:
    if: github.repository == 'ArchaiosMagister/CuadernoTextosLatinos'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validar antes de preparar la vista
        run: npm run check
      - name: Instalar WebKit
        run: npx playwright install --with-deps webkit
      - name: Probar interfaz Safari/WebKit
        run: npm run test:e2e
      - name: Copiar compilación única a ruta de pruebas dentro de esta rama
        run: |
          rm -rf preview/pr-10
          mkdir -p preview/pr-10
          cp -a dist/. preview/pr-10/
          python3 - <<'PY'
          from pathlib import Path
          path=Path('preview/pr-10/index.html')
          html=path.read_text()
          html=html.replace(
            '<meta name="viewport" content="width=device-width, initial-scale=1" />',
            '<meta name="viewport" content="width=device-width, initial-scale=1" />\n'
            '    <meta name="robots" content="noindex, nofollow" />'
          )
          html=html.replace(
            '<body>',
            '<body>\n'
            '    <div role="note" style="font:14px system-ui;padding:10px 14px;'
            'background:#fff3ce;color:#382b00;border-bottom:1px solid #ba9941">'
            'VISTA DE PRUEBA · PR #10 · Sin fusionar ni publicar en la web habitual. '
            'Los datos de esta prueba se guardan únicamente en este navegador y '
            'origen. No introduzcas materiales definitivos sin conservar una '
            'copia de seguridad JSON.</div>'
          )
          path.write_text(html)
          print('Ficheros preparados:', len(list(Path('preview/pr-10').rglob('*'))))
          PY
      - name: Guardar compilación de prueba exclusivamente en la rama PR10
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f preview/pr-10/
          if git diff --cached --quiet; then
            echo 'La compilación de prueba no ha cambiado.'
          else
            git commit -m 'chore(preview): compilar PR10 para vista aislada (no producción)'
            git push origin HEAD:refs/heads/feat/interfaz-editorial-primera-iteracion
          fi
          echo "Preview commit: $(git rev-parse HEAD)"
          echo "Probable URL: https://raw.githack.com/ArchaiosMagister/CuadernoTextosLatinos/$(git rev-parse HEAD)/preview/pr-10/index.html"
      - name: Guardar compilación descargable también en Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuaderno-pr10-vista-de-prueba
          path: preview/pr-10/
          retention-days: 7
          if-no-files-found: ignore
