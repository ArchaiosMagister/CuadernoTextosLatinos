name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar TypeScript (versión fijada en package.json)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validar tipos, contratos y compilación
        run: npm run check
      - name: Instalar motor WebKit para la prueba de interfaz
        run: npx playwright install --with-deps webkit
      - name: Probar guardado, exportación y restauración en WebKit
        run: npm run test:e2e

      - name: Inspeccionar corpus Examinator2 (temporal)
        run: node scripts/probe-examinator.mjs
