name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar TypeScript (versión fijada en package.json)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validar tipos, contratos y compilación
        run: npm run check
