name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar TypeScript (versión fijada en package.json)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validar tipos, contratos y compilación
        run: npm run check
      - name: Instalar motor WebKit para la prueba de interfaz
        shell: bash
        run: |
          set -euo pipefail
          # Playwright instala bibliotecas del sistema; usar el mirror oficial,
          # no el mirror regional EC2 ni repositorios externos del runner.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          grep -q 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i 's@mirror+file:/etc/apt/apt-mirrors.txt@https://archive.ubuntu.com/ubuntu@g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo mkdir -p /tmp/cuaderno-apt-sources-externas
          for source in /etc/apt/sources.list.d/*; do
            case "$source" in
              */ubuntu.sources) ;;
              *.list|*.sources) sudo mv "$source" /tmp/cuaderno-apt-sources-externas/ ;;
            esac
          done
          npx playwright install --with-deps webkit
      - name: Probar guardado, exportación y restauración en WebKit
        run: npm run test:e2e
