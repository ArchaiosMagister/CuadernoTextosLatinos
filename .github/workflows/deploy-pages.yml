name: Publicar comprobador de fase 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de desarrollo
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Comprobar tipos, pruebas y compilación
        run: npm run check
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar el comprobador
        id: deployment
        uses: actions/deploy-pages@v4
