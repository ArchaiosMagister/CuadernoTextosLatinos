name: Cuaderno estable + vista de prueba del rediseño PR14

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Obtener exclusivamente la versión estable desde main
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias declaradas
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compilar y ejecutar pruebas de tipos y contratos
        run: npm run check
      - name: Instalar WebKit para compatibilidad con iPad Safari
        run: npx playwright install --with-deps webkit
      - name: Probar exportación, edición, guardado y restauración
        run: npm run test:e2e
      - name: Mantener una vía segura para descargar datos creados en /prueba/
        run: |
          test -f dist/storage/workspace-repository.js
          test -f dist/storage/indexeddb-corpus-repository.js
          test -f dist/storage/workspace-backup.js
          test -f dist/core/backup.js
          mkdir -p dist/recuperar-prueba
          cp static/recuperar-prueba/index.html dist/recuperar-prueba/index.html
          # La aplicación experimental ya no forma parte del despliegue.
          test ! -e dist/prueba
      - name: Verificar en WebKit que ambas copias JSON de /prueba/ son recuperables
        run: node scripts/smoke-recovery.mjs
      - name: Obtener revisión verificada de PR #14
        uses: actions/checkout@v4
        with:
          repository: ArchaiosMagister/CuadernoTextosLatinos
          ref: 84ce4c9e5a00e451fb249f5751739722de7e1c8a
          path: experimental
          persist-credentials: false
      - name: Compilar la versión experimental sin tocar la estable
        working-directory: experimental
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Ejecutar pruebas Safari/WebKit del rediseño
        working-directory: experimental
        run: npm run test:e2e
      - name: Agregar /prueba/ preservando la web estable y copias de la prueba anterior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil

          root=Path('dist')
          source=Path('experimental/dist')
          preview=root/'prueba'
          assert (root/'recuperar-prueba/index.html').is_file(), 'Falta recuperación de PR10'
          assert not preview.exists(), 'La web estable contiene /prueba/ inesperadamente'
          originals={p.relative_to(root):hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in root.rglob('*') if p.is_file()}
          shutil.copytree(source,preview)

          html=preview/'index.html'
          contents=html.read_text()
          assert contents.count('<body>')==1
          notice=(
            '<div role="note" style="font:14px system-ui;'
            'padding:10px 14px;background:#fff3ce;color:#332700;'
            'border-bottom:1px solid #ba9941">'
            '<strong>VISTA DE PRUEBA — REDISEÑO PR #14</strong>'
            ' · La web definitiva está en la dirección sin /prueba/.'
            ' Guarda una copia JSON de los cuadernos que crees aquí.'
            '</div>'
          )
          contents=contents.replace('<body>','<body>\n'+notice,1)
          contents=contents.replace('<head>','<head>\n<meta name="robots" content="noindex, nofollow">',1)
          html.write_text(contents)

          db_map={
            'storage/indexeddb-corpus-repository.js':(
              "'cuaderno-textos-latinos'",
              "'cuaderno-textos-latinos-prueba-pr14'"
            ),
            'storage/workspace-repository.js':(
              "'cuaderno-textos-latinos-workspace'",
              "'cuaderno-textos-latinos-workspace-prueba-pr14'"
            ),
          }
          for rel,(before,after) in db_map.items():
            file=preview/rel
            code=file.read_text()
            assert code.count(before)==1, 'No se pudo aislar IndexedDB: '+rel
            file.write_text(code.replace(before,after,1))
          sw=preview/'service-worker.js'
          code=sw.read_text()
          assert code.count('cuaderno-textos-')>=2
          sw.write_text(code.replace('cuaderno-textos-','cuaderno-preview-pr14-'))

          for rel,digest in originals.items():
            assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest, (
              'Cambió la app estable: '+str(rel)
            )
          css=(preview/'styles.css').read_text()
          assert '.edition-preview-stack' in css
          # El puente Cuadernos -> editor debe estar en la copia publicada.
          editor=(preview/'ui/edition-app.js').read_text()
          assert 'importLegacyNotebook' in editor
          assert 'Preparar cuaderno seleccionado' in editor
          library=(preview/'ui/library-app.js').read_text()
          assert 'Cuaderno terminado' in library
          assert 'Etiquetas gramaticales' in library
          assert 'Filtrar por etiquetas gramaticales' in library
          tags=(preview/'core/grammar-tags.js').read_text()
          assert 'gram.inf.perfecto' in tags
          assert 'gram.inf.pasivo' in tags
          assert 'gram.agente' in tags
          assert 'gram.relativo.enlace' in tags
          assert 'min-height:0!important;height:auto!important' in css
          print('OK: /prueba/ creada, IndexedDB y SW independientes.')
          print('OK: '+str(len(originals))+' archivos estables byte a byte idénticos.')
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar estable, recuperación y rediseño provisional
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}prueba/
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar estable y ruta experimental separada
        id: deployment
        uses: actions/deploy-pages@v4


  verificar-vista-publica:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      ROOT: https://archaiosmagister.github.io/CuadernoTextosLatinos/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar HTTPS, bases aisladas y web estable intacta
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html main.js styles.css recuperar-prueba/index.html prueba/index.html prueba/styles.css prueba/main.js prueba/core/grammar-tags.js prueba/ui/library-app.js prueba/storage/workspace-repository.js prueba/storage/indexeddb-corpus-repository.js prueba/service-worker.js; do
            url="$ROOT$f"
            echo "Verificando $url"
            curl --fail --location --retry 6 --retry-delay 3 --silent --show-error \
              -o /tmp/cuaderno-public "$url"
            test -s /tmp/cuaderno-public
            case "$f" in
              "index.html")
                if grep -q "VISTA DE PRUEBA — REDISEÑO" /tmp/cuaderno-public; then
                  echo "::error::La portada estable contiene la marca experimental"
                  exit 1
                fi ;;
              "recuperar-prueba/index.html")
                grep -q 'cuaderno-textos-latinos-workspace-prueba-pr10' /tmp/cuaderno-public ;;
              "prueba/index.html")
                grep -q 'VISTA DE PRUEBA — REDISEÑO PR #14' /tmp/cuaderno-public ;;
              "prueba/styles.css")
                grep -q 'edition-preview-stack' /tmp/cuaderno-public
                grep -q 'min-height:0!important;height:auto!important' /tmp/cuaderno-public ;;
              "prueba/core/grammar-tags.js")
                grep -q 'gram.inf.pasivo' /tmp/cuaderno-public
                grep -q 'gram.agente' /tmp/cuaderno-public ;;
              "prueba/ui/library-app.js")
                grep -q 'Cuaderno terminado' /tmp/cuaderno-public
                grep -q 'Etiquetas gramaticales' /tmp/cuaderno-public ;;
              "prueba/storage/workspace-repository.js")
                grep -q "'cuaderno-textos-latinos-workspace-prueba-pr14'" /tmp/cuaderno-public ;;
              "prueba/storage/indexeddb-corpus-repository.js")
                grep -q "'cuaderno-textos-latinos-prueba-pr14'" /tmp/cuaderno-public ;;
              "prueba/service-worker.js")
                grep -q 'cuaderno-preview-pr14-' /tmp/cuaderno-public ;;
              "prueba/main.js")
                grep -q 'mountLibraryApp' /tmp/cuaderno-public ;;
            esac
          done
      - name: Instalar Safari/WebKit
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps webkit
      - name: Abrir prueba publicada en WebKit iPad
        run: |
          node --input-type=module <<'JS'
          import {webkit} from '@playwright/test';
          const browser=await webkit.launch({headless:true});
          try {
            const page=await browser.newPage({
              viewport:{width:820,height:1180},isMobile:true,hasTouch:true,deviceScaleFactor:2
            });
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const url=process.env.ROOT+'prueba/';
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            await page.getByRole('button',{name:'Preparar cuaderno'}).waitFor({state:'visible',timeout:40000});
            if(!(await page.locator('body').innerText()).includes('VISTA DE PRUEBA — REDISEÑO PR #14'))
              throw Error('Falta marca provisional');
            await page.getByRole('button',{name:'Preparar cuaderno'}).click();
            await page.getByRole('heading',{name:'Editor de cuadernos'}).waitFor();
            page.once('dialog',dialog=>dialog.accept('Prueba pública de diseño'));
            await page.getByRole('button',{name:'+ Cuaderno'}).click();
            await page.locator('.edition-preview-stack > .edition-navigation').waitFor();
            console.log('Preview HTTP:',res?.status(),'URL:',page.url(),'errores JS:',errors);
            if(res?.status()!==200||errors.length)throw Error('Fallo carga Safari WebKit');
            await page.screenshot({path:'preview-redisenio-ipad.png',fullPage:false});
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vista-redisenio-ipad-pr14
          path: preview-redisenio-ipad.png
          if-no-files-found: ignore
          retention-days: 7
