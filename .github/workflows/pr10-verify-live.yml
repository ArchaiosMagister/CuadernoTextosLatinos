name: Verificar URL de la vista PR10

on:
  push:
    branches: [feat/interfaz-editorial-primera-iteracion]
    paths:
      - '.github/workflows/pr10-verify-live.yml'

permissions:
  contents: read

jobs:
  url-publica:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PREVIEW: https://raw.githack.com/ArchaiosMagister/CuadernoTextosLatinos/d040697bd7affdd8516449b130e30c13c601cc47/preview/pr-10/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspeccionar las respuestas HTTPS de la vista de pruebas
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html main.js styles.css library/catalog.json; do
            url="$PREVIEW$file"
            echo "Checking $url"
            curl -L --retry 5 --retry-delay 3 --fail --silent --show-error \
              -D /tmp/headers -o /tmp/preview-payload "$url"
            sed -n '1,18p' /tmp/headers
            wc -c /tmp/preview-payload
            if [[ "$file" == "index.html" ]]; then
              grep -q '<title>Cuaderno de textos latinos' /tmp/preview-payload
            fi
          done
      - name: Instalar Playwright WebKit
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps webkit
      - name: Abrir la vista de prueba con WebKit como iPad
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { webkit } from '@playwright/test';
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:820,height:1180},
            deviceScaleFactor:2, isMobile:true,hasTouch:true,
          });
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          const url=process.env.PREVIEW+'index.html';
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
          console.log('HTTP',response?.status(),'URL',url);
          if((await page.title()).includes('External Content Notice')){
            console.log('El proveedor presenta una confirmación de seguridad antes de abrir HTML.');
            await page.getByText('Open the page',{exact:true}).click();
            await page.waitForLoadState('domcontentloaded');
          }
          await page.waitForTimeout(6000);
          console.log('TITLE',await page.title());
          const body=(await page.locator('body').innerText()).slice(0,5000);
          console.log('BODY',body.slice(0,800));
          console.log('ERRORS',errors);
          if(response?.status()!==200)throw new Error('Preview HTTP distinto de 200');
          if(!body.includes('Biblioteca')||!body.includes('Cuaderno'))
            throw new Error('El editor no se ha cargado correctamente en WebKit');
          if(errors.length)throw new Error('Errores JavaScript: '+errors.join('; '));
          await browser.close();
          JS
